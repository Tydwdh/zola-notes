{% extends "base.html" %}

{% block title %}标签 | {{ config.title }}{% endblock title %}

{% block content %}
<section class="section-heading">
  <h1>标签</h1>
</section>

<section class="tag-cloud" aria-label="tags">
  {% for term in terms %}
  <a href="{{ term.permalink | safe }}">{{ term.name }} <span>{{ term.pages | length }}</span></a>
  {% endfor %}
</section>
{% endblock content %}
