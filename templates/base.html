<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <script>
    (() => {
      try {
        const savedTheme = window.localStorage.getItem('zola-notes:theme');
        const theme = savedTheme === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (_) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <link rel="stylesheet" href="{{ get_url(path='site.css') }}">
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  {% set icon_sprite = get_url(path='icons/lucide-sprite.svg') %}
  <header class="site-header">
    <a class="site-title" href="{{ get_url(path='/') }}">
      <svg class="site-mark" aria-hidden="true"><use href="{{ icon_sprite }}#book-open-text"></use></svg>
      <span>{{ config.title }}</span>
    </a>
    <nav class="site-nav" aria-label="main navigation">
      <a href="{{ get_url(path='/posts/') }}"><svg aria-hidden="true"><use href="{{ icon_sprite }}#file-text"></use></svg>文章</a>
      <a href="{{ get_url(path='/tags/') }}"><svg aria-hidden="true"><use href="{{ icon_sprite }}#tags"></use></svg>标签</a>
      <button class="theme-toggle" type="button" aria-label="切换为深色主题" aria-pressed="false" data-theme-toggle>
        <span class="theme-toggle-track" aria-hidden="true">
          <svg class="theme-toggle-mark theme-toggle-sun" viewBox="0 0 24 24"><use href="{{ icon_sprite }}#sun"></use></svg>
          <svg class="theme-toggle-mark theme-toggle-moon" viewBox="0 0 24 24"><use href="{{ icon_sprite }}#moon"></use></svg>
          <span class="theme-toggle-thumb">
            <svg viewBox="0 0 24 24"><use data-theme-toggle-icon href="{{ icon_sprite }}#sun"></use></svg>
          </span>
        </span>
      </button>
    </nav>
  </header>
  <main class="page-shell">
    {% block content %}{% endblock content %}
  </main>
  <div class="cursor-effects" aria-hidden="true"></div>
  <script src="{{ get_url(path='vendor/live2d/L2Dwidget.min.js') }}"></script>
  <script>
    (() => {
      const cards = document.querySelectorAll('.post-item');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (window.L2Dwidget && !reduceMotion) {
        window.L2Dwidget.init({
          model: {
            jsonPath: "{{ get_url(path='vendor/live2d/shizuku/shizuku.model.json') }}",
            scale: 1
          },
          display: {
            position: "right",
            width: 150,
            height: 300,
            hOffset: 4,
            vOffset: -30
          },
          mobile: {
            show: false
          },
          react: {
            opacity: 0.86
          },
          dialog: {
            enable: true,
            hitokoto: false
          }
        });
      }

      cards.forEach((card) => {
        card.addEventListener('pointermove', (event) => {
          const rect = card.getBoundingClientRect();
          card.style.setProperty('--mx', `${event.clientX - rect.left}px`);
          card.style.setProperty('--my', `${event.clientY - rect.top}px`);
        });
      });

      const themeStorageKey = 'zola-notes:theme';
      const themeToggle = document.querySelector('[data-theme-toggle]');
      const themeToggleIcon = document.querySelector('[data-theme-toggle-icon]');
      const setTheme = (theme) => {
        const nextTheme = theme === 'dark' ? 'dark' : 'light';
        const isDark = nextTheme === 'dark';
        document.documentElement.dataset.theme = nextTheme;
        document.documentElement.style.colorScheme = nextTheme;

        if (themeToggle) {
          themeToggle.setAttribute('aria-pressed', String(isDark));
          themeToggle.setAttribute('aria-label', isDark ? '切换为浅色主题' : '切换为深色主题');
        }

        if (themeToggleIcon) {
          const href = themeToggleIcon.getAttribute('href') || '';
          themeToggleIcon.setAttribute('href', href.replace(/#.*$/, isDark ? '#moon' : '#sun'));
        }
      };

      setTheme(document.documentElement.dataset.theme);
      themeToggle?.addEventListener('click', () => {
        const nextTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        setTheme(nextTheme);

        try {
          window.localStorage.setItem(themeStorageKey, nextTheme);
        } catch (_) {
          // Ignore storage errors in private browsing or restricted contexts.
        }
      });

      const folderStorageKey = 'zola-notes:open-folders';
      const readOpenFolders = () => {
        try {
          const saved = JSON.parse(window.localStorage.getItem(folderStorageKey) || '[]');
          return new Set(Array.isArray(saved) ? saved : []);
        } catch (_) {
          return new Set();
        }
      };
      const writeOpenFolders = (openFolders) => {
        try {
          window.localStorage.setItem(folderStorageKey, JSON.stringify([...openFolders]));
        } catch (_) {
          // Ignore storage errors in private browsing or restricted contexts.
        }
      };
      const openFolders = readOpenFolders();

      const countFolderPages = (node) => {
        const directCount = Number.parseInt(node.dataset.directCount || '0', 10) || 0;
        const childNodes = node.querySelectorAll(':scope > .folder-children > .folder-node');
        let totalCount = directCount;

        childNodes.forEach((childNode) => {
          totalCount += countFolderPages(childNode);
        });

        const counter = node.querySelector(':scope > .folder-row [data-folder-count]');
        if (counter) {
          counter.textContent = totalCount;
        }

        return totalCount;
      };

      const setFolderExpanded = (node, expanded, persist = true) => {
        const children = node.querySelector(':scope > .folder-children');
        const toggle = node.querySelector(':scope > .folder-row [data-folder-toggle]');
        const path = node.dataset.folderPath;

        if (!children || !toggle) {
          return;
        }

        const title = node.querySelector(':scope > .folder-row strong')?.textContent?.trim() || '目录';
        const icon = node.querySelector(':scope > .folder-row .tree-icon use');
        children.hidden = !expanded;
        node.classList.toggle('is-expanded', expanded);
        toggle.setAttribute('aria-expanded', String(expanded));
        toggle.setAttribute('aria-label', `${expanded ? '收起' : '展开'} ${title}`);

        if (icon) {
          const href = icon.getAttribute('href') || '';
          icon.setAttribute('href', href.replace(/#.*$/, expanded ? '#folder-open' : '#folder'));
        }

        if (persist && path) {
          if (expanded) {
            openFolders.add(path);
          } else {
            openFolders.delete(path);
          }
          writeOpenFolders(openFolders);
        }
      };

      document.querySelectorAll('.folder-tree > .folder-node').forEach((node) => {
        countFolderPages(node);
      });

      document.querySelectorAll('.folder-node.has-children').forEach((node) => {
        const toggle = node.querySelector(':scope > .folder-row [data-folder-toggle]');
        const path = node.dataset.folderPath;

        setFolderExpanded(node, path ? openFolders.has(path) : false, false);

        toggle?.addEventListener('click', (event) => {
          event.preventDefault();
          setFolderExpanded(node, !node.classList.contains('is-expanded'));
        });
      });

      document.querySelectorAll('.toc-panel a[href*="#"]').forEach((link) => {
        link.addEventListener('click', (event) => {
          const href = link.getAttribute('href');
          if (!href) {
            return;
          }

          const url = new URL(href, window.location.href);
          if (url.origin !== window.location.origin || url.pathname !== window.location.pathname || !url.hash) {
            return;
          }

          const rawId = url.hash.slice(1);
          let target = document.getElementById(rawId);

          if (!target) {
            try {
              target = document.getElementById(decodeURIComponent(rawId));
            } catch (_) {
              target = null;
            }
          }

          if (!target) {
            return;
          }

          event.preventDefault();
          target.scrollIntoView({
            behavior: reduceMotion ? 'auto' : 'smooth',
            block: 'start'
          });
          window.history.replaceState(null, '', `${url.pathname}${url.search}${url.hash}`);
        });
      });

      document.querySelectorAll('.article-body pre').forEach((pre) => {
        const code = pre.querySelector('code');
        if (!code || pre.closest('.code-shell')) {
          return;
        }

        const shell = document.createElement('div');
        shell.className = 'code-shell';
        pre.parentNode.insertBefore(shell, pre);
        shell.appendChild(pre);

        const button = document.createElement('button');
        button.className = 'code-copy-button';
        button.type = 'button';
        button.setAttribute('aria-label', '复制代码');
        button.innerHTML = `
          <span class="copy-label">复制</span>
          <span class="copy-done-icon" aria-hidden="true">✓</span>
        `;
        shell.appendChild(button);

        const copyText = async () => {
          const text = code.textContent || '';

          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            return;
          }

          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.setAttribute('readonly', '');
          textarea.style.position = 'fixed';
          textarea.style.left = '-9999px';
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          textarea.remove();
        };

        button.addEventListener('click', async () => {
          try {
            await copyText();
            button.classList.add('is-copied');
            button.setAttribute('aria-label', '已复制');
            window.setTimeout(() => {
              button.classList.remove('is-copied');
              button.setAttribute('aria-label', '复制代码');
            }, 1200);
          } catch (_) {
            button.classList.add('is-error');
            button.setAttribute('aria-label', '复制失败');
            window.setTimeout(() => {
              button.classList.remove('is-error');
              button.setAttribute('aria-label', '复制代码');
            }, 1200);
          }
        });
      });

      document.querySelectorAll('.article-body img').forEach((image) => {
        image.loading = image.loading || 'lazy';
        image.decoding = image.decoding || 'async';
        image.tabIndex = 0;
        image.setAttribute('role', 'button');
        image.setAttribute('aria-label', '查看原图');

        const openImage = () => {
          const lightbox = document.createElement('div');
          lightbox.className = 'image-lightbox';
          lightbox.setAttribute('role', 'dialog');
          lightbox.setAttribute('aria-modal', 'true');

          const closeButton = document.createElement('button');
          closeButton.type = 'button';
          closeButton.setAttribute('aria-label', '关闭图片预览');
          closeButton.textContent = '×';

          const preview = document.createElement('img');
          preview.src = image.currentSrc || image.src;
          preview.alt = image.alt || '';

          const close = () => {
            lightbox.remove();
            document.removeEventListener('keydown', onKeydown);
          };

          const onKeydown = (event) => {
            if (event.key === 'Escape') {
              close();
            }
          };

          lightbox.addEventListener('click', (event) => {
            if (event.target === lightbox) {
              close();
            }
          });
          closeButton.addEventListener('click', close);
          document.addEventListener('keydown', onKeydown);

          lightbox.appendChild(closeButton);
          lightbox.appendChild(preview);
          document.body.appendChild(lightbox);
          closeButton.focus();
        };

        image.addEventListener('click', openImage);
        image.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            openImage();
          }
        });
      });

      const effectsLayer = document.querySelector('.cursor-effects');
      const finePointer = window.matchMedia('(pointer: fine)').matches;

      if (effectsLayer && finePointer && !reduceMotion) {
        let colorIndex = 0;

        const colors = () => {
          const styles = getComputedStyle(document.documentElement);
          return [
            styles.getPropertyValue('--effect-a').trim() || '#1f6f66',
            styles.getPropertyValue('--effect-b').trim() || '#a15c26'
          ];
        };

        let palette = colors();

        const trimLayer = () => {
          while (effectsLayer.childElementCount > 90) {
            effectsLayer.firstElementChild?.remove();
          }
        };

        const spawn = (className, x, y, options = {}) => {
          const node = document.createElement('span');
          node.className = className;
          node.style.left = `${x}px`;
          node.style.top = `${y}px`;
          node.style.setProperty('--effect-color', options.color || palette[colorIndex % palette.length]);
          node.style.setProperty('--dx', `${options.dx || 0}px`);
          node.style.setProperty('--dy', `${options.dy || 0}px`);
          node.style.setProperty('--size', `${options.size || 8}px`);
          effectsLayer.appendChild(node);
          trimLayer();
          node.addEventListener('animationend', () => node.remove(), { once: true });
          return node;
        };

        const click = (event) => {
          if (event.button !== 0) {
            return;
          }

          const x = event.clientX;
          const y = event.clientY;
          palette = colors();

          spawn('click-ring', x, y, {
            color: palette[0],
            size: 18
          });

          for (let i = 0; i < 10; i += 1) {
            const angle = (Math.PI * 2 * i) / 10;
            const distance = 26 + Math.random() * 16;
            spawn('click-spark', x, y, {
              color: palette[i % palette.length],
              size: 4 + Math.random() * 3,
              dx: Math.cos(angle) * distance,
              dy: Math.sin(angle) * distance
            });
          }
        };

        window.addEventListener('resize', () => {
          palette = colors();
        }, { passive: true });
        window.addEventListener('pointerdown', click, { passive: true });
      }
    })();
  </script>
</body>
</html>
